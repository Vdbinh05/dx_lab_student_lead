services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dx-lab-sv1-training-os:0.3.0
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOCAL_DATABASE_URL: file:/data/training.db
      DATABASE_URL: file:/data/training.db
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - training_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  training_data:
    name: "${TRAINING_VOLUME_NAME:-dx_lab_sv1_training_data}"
